name: Supabase migrations

on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase-migrations.yml']
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase-migrations.yml']
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      # Session pooler connection string; connects straight to Postgres, so no
      # Supabase account token or `supabase link` is needed.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      # PRs only preview which migrations would run; merging to main applies them.
      - name: Preview migrations
        if: github.event_name == 'pull_request'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
      - name: Apply migrations
        if: github.event_name != 'pull_request'
        run: supabase db push --db-url "$SUPABASE_DB_URL"
